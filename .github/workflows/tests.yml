# Integración continua (C-2) del repositorio público: scripts/publicar.sh sube la rama local «publico» como main.
# Unitarios + lint en cada push y PR; los e2e con el Chromium de Playwright (~10 min) en un trabajo aparte.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"   # la de requirements.lock
  PANEL_DISABLE_BRIDGES: "1"
  PANEL_DISABLE_SCHEDULER: "1"

jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: Lint y formato
        run: |
          ruff check .
          ruff format --check .
          mypy
          npx eslint .
      - name: Unitarios con cobertura
        run: python -m pytest --ignore=tests/e2e --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: unitarios
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Dependencias y Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Navegador (tests/e2e)
        run: python -m pytest tests/e2e
