[pytest]
testpaths = tests
addopts = -q
# Solo se ignoran avisos de terceros que no se pueden arreglar desde el panel (V-7); los demás DeprecationWarning se ven.
#  - starlette 1.6 quiere httpx2 en su TestClient: cambiarlo es otra dependencia, no un arreglo (es un UserWarning).
#  - starlette.testclient aún usa el alias anyio.abc.BlockingPortal.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient
